name = "fv-rollup"
version = "0.1.0"
defaultTargets = ["semantics", "invariants", "proofs"]

[[lean_lib]]
name = "semantics"
globs = ["semantics.+"]

[[lean_lib]]
name = "invariants"
globs = ["invariants.+"]

[[lean_lib]]
name = "proofs"
globs = ["proofs.+"]
weakLeanArgs = ["-j1"]

[[require]]
name = "EquiVM"
git = "https://github.com/dcposch/EquiVM.git"
rev = "3db734e592aae8da5bc103db7eec61def39c27f5"

[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "cdbd150780e6f41ebb989eaedc2248bf9ec16861"
